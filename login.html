<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Chemistry Hub</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #statusMessage {
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        .links-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .links-container a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }

        .links-container a:hover {
            text-decoration: underline;
        }

        .back-link {
            margin-top: 15px;
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">Chemistry Hub</h1>
        <p class="subtitle" id="cardSubtitle">تسجيل الدخول للموقع</p>

        <form id="authForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول</button>
            <p id="statusMessage"></p>
        </form>

        <div class="links-container">
            <a id="resetPasswordBtn">نسيت كلمة المرور؟</a>
            <a id="toggleModeBtn">إنشاء حساب جديد</a>
        </div>

        <a href="https://chemistryhub.vercel.app/#subjects" class="back-link">العودة للموقع الرئيسي</a>
    </div>

    <script>
        const SUPABASE_URL = "https://egpirypsqsxdwkhdqcic.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_pyP45jE5VbutNadBRrvfrw_q0_L7_A3";

        // التصحيح الأساسي لإستدعاء المكتبة بنجاح
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authForm = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const cardSubtitle = document.getElementById('cardSubtitle');
        const passwordGroup = document.getElementById('passwordGroup');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');
        const passwordInput = document.getElementById('password');

        let currentMode = 'login';

        toggleModeBtn.addEventListener('click', () => {
            if (currentMode === 'login') {
                currentMode = 'signup';
                cardSubtitle.textContent = "إنشاء حساب جديد";
                submitBtn.textContent = "إنشاء الحساب";
                toggleModeBtn.textContent = "لديك حساب بالفعل؟ تسجيل الدخول";
                passwordGroup.style.display = "block";
                passwordInput.required = true;
            } else {
                setLoginMode();
            }
            clearStatus();
        });

        resetPasswordBtn.addEventListener('click', () => {
            currentMode = 'reset';
            cardSubtitle.textContent = "استعادة كلمة المرور";
            submitBtn.textContent = "إرسال رابط وإعادة الضبط";
            passwordGroup.style.display = "none";
            passwordInput.required = false;
            toggleModeBtn.textContent = "العودة لتسجيل الدخول";
            clearStatus();
        });

        function setLoginMode() {
            currentMode = 'login';
            cardSubtitle.textContent = "تسجيل الدخول للموقع";
            submitBtn.textContent = "تسجيل الدخول";
            toggleModeBtn.textContent = "إنشاء حساب جديد";
            passwordGroup.style.display = "block";
            passwordInput.required = true;
        }

        function clearStatus() {
            statusMessage.style.display = "none";
        }

        function showMessage(msg, isError = true) {
            statusMessage.textContent = msg;
            statusMessage.style.color = isError ? "#f87171" : "#4ade80";
            statusMessage.style.display = "block";
        }

        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            submitBtn.disabled = true;
            clearStatus();

            if (currentMode === 'login') {
                submitBtn.textContent = "جاري التحقق...";
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    showMessage("خطأ: البريد أو كلمة المرور غير صحيحة");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "تسجيل الدخول";
                } else {
                    window.location.href = "https://chemistryhub.vercel.app/#subjects";
                }

            } else if (currentMode === 'signup') {
                submitBtn.textContent = "جاري إنشاء الحساب...";
                const { error } = await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    showMessage("خطأ في إنشاء الحساب: " + error.message);
                } else {
                    showMessage("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.", false);
                    setTimeout(setLoginMode, 2000);
                }
                submitBtn.disabled = false;
                submitBtn.textContent = "إنشاء الحساب";

            } else if (currentMode === 'reset') {
                submitBtn.textContent = "جاري الإرسال...";
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://chemistryhub.vercel.app/login.html'
                });

                if (error) {
                    showMessage("حدث خطأ: " + error.message);
                } else {
                    showMessage("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.", false);
                }
                submitBtn.disabled = false;
                submitBtn.textContent = "إرسال رابط وإعادة الضبط";
            }
        });
    </script>

</body>
</html>
