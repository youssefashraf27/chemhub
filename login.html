<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Chemistry Hub</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* الحقول الإضافية تكون مخفية في وضع تسجيل الدخول وتظهر فقط عند إنشاء حساب */
        .signup-only {
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #statusMessage {
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        .links-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .links-container button {
            background: none;
            border: none;
            color: #38bdf8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0;
            text-decoration: underline;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">Chemistry Hub</h1>
        <p class="subtitle" id="cardSubtitle">تسجيل الدخول للموقع</p>

        <form id="authForm">
            <!-- حقل الاسم الكامل (عند إنشاء الحساب فقط) -->
            <div class="form-group signup-only">
                <label for="fullName">الاسم بالكامل</label>
                <input type="text" id="fullName" placeholder="اسمك رباعي">
            </div>

            <!-- حقل رقم الهاتف (عند إنشاء الحساب فقط) -->
            <div class="form-group signup-only">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="01xxxxxxxxx">
            </div>

           <!-- حقل الفرقة الدراسية -->
<div class="form-group signup-only">
    <label for="grade">الفرقة</label>
    <select id="grade">
        <option value="Year 1">الفرقة الأولى</option>
        <option value="Year 2">الفرقة الثانية</option>
        <option value="Year 3">الفرقة الثالثة</option>
        <option value="Year 4">الفرقة الرابعة</option>
    </select>
</div>
            </div>

            <!-- حقل البريد الإلكتروني -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="form-group" id="passwordGroup">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول</button>
            <p id="statusMessage"></p>
        </form>

        <div class="links-container">
            <button type="button" onclick="switchMode('reset')">نسيت كلمة المرور؟</button>
            <button type="button" id="toggleBtn" onclick="toggleSignupLogin()">إنشاء حساب جديد</button>
        </div>

        <a href="https://chemistryhub.vercel.app/#subjects" class="back-link">العودة للموقع الرئيسي</a>
    </div>

    <script>
        const SUPABASE_URL = "https://egpirypsqsxdwkhdqcic.supabase.co"; 
        // استبدل المفتاح أدناه بمفتاح Legacy anon (الذي يبدأ بـ eyJ) الخاص بك
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVncGlyeXBzcXN4ZHdraGRxY2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjU2ODksImV4cCI6MjEwNDAwMTY4OX0.aFuKHNkLFhW7F3NxbyvOqb9_O7TSOS1XI6WQmx1bAb4";

        let supabaseClient = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        });

        let currentMode = 'login';

        function toggleSignupLogin() {
            if (currentMode === 'login') {
                switchMode('signup');
            } else {
                switchMode('login');
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const subtitle = document.getElementById('cardSubtitle');
            const submitBtn = document.getElementById('submitBtn');
            const toggleBtn = document.getElementById('toggleBtn');
            const passwordGroup = document.getElementById('passwordGroup');
            const passwordInput = document.getElementById('password');
            const signupFields = document.querySelectorAll('.signup-only');

            clearStatus();

            if (mode === 'signup') {
                subtitle.textContent = "إنشاء حساب جديد";
                submitBtn.textContent = "إنشاء الحساب";
                toggleBtn.textContent = "لديك حساب بالفعل؟ تسجيل الدخول";
                passwordGroup.style.display = "block";
                passwordInput.required = true;
                
                // إظهار الحقول الإضافية وجعل الاسم متطلبًا
                signupFields.forEach(el => el.style.display = "block");
                document.getElementById('fullName').required = true;

            } else if (mode === 'reset') {
                subtitle.textContent = "استعادة كلمة المرور";
                submitBtn.textContent = "إرسال رابط إعادة التعيين";
                toggleBtn.textContent = "العودة لتسجيل الدخول";
                passwordGroup.style.display = "none";
                passwordInput.required = false;

                // إخفاء الحقول الإضافية
                signupFields.forEach(el => el.style.display = "none");
                document.getElementById('fullName').required = false;

            } else {
                subtitle.textContent = "تسجيل الدخول للموقع";
                submitBtn.textContent = "تسجيل الدخول";
                toggleBtn.textContent = "إنشاء حساب جديد";
                passwordGroup.style.display = "block";
                passwordInput.required = true;

                // إخفاء الحقول الإضافية
                signupFields.forEach(el => el.style.display = "none");
                document.getElementById('fullName').required = false;
            }
        }

        function clearStatus() {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.style.display = "none";
        }

        function showMessage(msg, isError = true) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = msg;
            statusMessage.style.color = isError ? "#f87171" : "#4ade80";
            statusMessage.style.display = "block";
        }

        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!supabaseClient) {
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } else {
                    showMessage("تعذر الاتصال بخادم التسجيل، يرجى إعادة تحديث الصفحة.");
                    return;
                }
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            clearStatus();

            try {
                if (currentMode === 'login') {
                    submitBtn.textContent = "جاري التحقق...";
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) {
                        showMessage("خطأ: البريد أو كلمة المرور غير صحيحة");
                        submitBtn.disabled = false;
                        submitBtn.textContent = "تسجيل الدخول";
                    } else {
                        window.location.href = "https://chemistryhub.vercel.app/#subjects";
                    }

                } else if (currentMode === 'signup') {
                    submitBtn.textContent = "جاري إنشاء الحساب...";

                    // جلب البيانات الإضافية
                    const fullName = document.getElementById('fullName').value;
                    const phone = document.getElementById('phone').value;
                    const grade = document.getElementById('grade').value;

                    // إرسال البيانات بداخل options.data
                    const { error } = await supabaseClient.auth.signUp({ 
                        email, 
                        password,
                        options: {
                            data: {
                                full_name: fullName,
                                phone: phone,
                                grade: grade
                            }
                        }
                    });

                    if (error) {
                        showMessage("خطأ في إنشاء الحساب: " + error.message);
                    } else {
                        showMessage("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.", false);
                        setTimeout(() => switchMode('login'), 2000);
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = "إنشاء الحساب";

                } else if (currentMode === 'reset') {
                    submitBtn.textContent = "جاري الإرسال...";
                    const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
                    if (error) {
                        showMessage("حدث خطأ: " + error.message);
                    } else {
                        showMessage("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.", false);
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = "إرسال رابط إعادة التعيين";
                }
            } catch (err) {
                showMessage("حدث خطأ غير متوقع، يرجى المحاولة لاحقاً");
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
