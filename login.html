<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Chemistry Hub</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0369a1;
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #errorMessage {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        .links-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            font-size: 0.85rem;
        }

        .links-container a {
            color: #38bdf8;
            text-decoration: none;
        }

        .links-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">Chemistry Hub</h1>
        <p class="subtitle">تسجيل الدخول للموقع</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول</button>
            <p id="errorMessage"></p>
        </form>

        <div class="links-container">
            <a href="https://chemistryhub.vercel.app/#subjects">العودة للموقع الرئيسي</a>
        </div>
    </div>

    <script>
        // رابط مشروعك الخاص بـ Supabase
        const SUPABASE_URL = "https://egpirypsqsxdwkhdqcic.supabase.co"; 
        
        // مفتاح API الخاص بك (Publishable Key)
        const SUPABASE_ANON_KEY = "sb_publishable_pyP45jE5VbutNadBRrvfrw_q0_L7_A3";

        // تهيئة اتصال Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري التحقق...";
            errorMessage.style.display = "none";

            // عملية التحقق من الحساب في Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMessage.textContent = "خطأ في تسجيل الدخول: البريد أو كلمة المرور غير صحيحة";
                errorMessage.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "تسجيل الدخول";
            } else {
                // التحويل التلقائي للموقع بعد النجاح
                window.location.href = "https://chemistryhub.vercel.app/#subjects";
            }
        });
    </script>

</body>
</html>
