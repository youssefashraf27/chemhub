<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - ChemistryHub</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:rgba(30,41,59,.94);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px;box-shadow:0 20px 50px #0008}.brand-title{text-align:center;color:#38bdf8;margin:0 0 6px}.subtitle{text-align:center;color:#94a3b8;margin:0 0 22px}.form-group{margin-bottom:14px}.form-group label{display:block;color:#cbd5e1;font-size:.9rem;margin-bottom:6px}.form-group input,.form-group select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;outline:0}.form-group input:focus,.form-group select:focus{border-color:#38bdf8}.signup-only{display:none}.btn-submit{width:100%;padding:13px;border:0;border-radius:10px;background:#0284c7;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.btn-submit:disabled{opacity:.55;cursor:not-allowed}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.links button,.back-link{background:none;border:0;color:#38bdf8;cursor:pointer;text-decoration:underline;font:inherit;font-size:.88rem}.back-link{display:block;text-align:center;color:#94a3b8;margin-top:22px}.status{margin:12px 0 0;text-align:center;font-size:.9rem;display:none}.status.error{color:#f87171}.status.ok{color:#4ade80}.password-wrap{position:relative}.show-pass{position:absolute;left:8px;top:7px;border:0;background:transparent;color:#94a3b8;cursor:pointer;padding:5px}
</style>
</head>
<body>
<div class="login-card">
<h1 class="brand-title">Chemistry Hub</h1>
<p class="subtitle" id="cardSubtitle">تسجيل الدخول للموقع</p>
<form id="authForm">
<div class="form-group signup-only"><label for="fullName">الاسم بالكامل</label><input id="fullName" type="text" autocomplete="name" placeholder="أحمد محمد"></div>
<div class="form-group signup-only"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div>
<div class="form-group signup-only"><label for="grade">الفرقة</label><select id="grade"><option value="Year 1">الفرقة الأولى</option><option value="Year 2">الفرقة الثانية</option><option value="Year 3">الفرقة الثالثة</option><option value="Year 4">الفرقة الرابعة</option></select></div>
<div class="form-group"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required placeholder="example@mail.com"></div>
<div class="form-group" id="passwordGroup"><label for="password">كلمة المرور</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button class="show-pass" id="showPass" type="button">إظهار</button></div></div>
<button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول</button>
<p id="statusMessage" class="status"></p>
</form>
<div class="links"><button type="button" id="resetBtn">نسيت كلمة المرور؟</button><button type="button" id="toggleBtn">إنشاء حساب جديد</button></div>
<a href="index.html#subjects" class="back-link">العودة للموقع الرئيسي</a>
</div>
<script>
let client; let currentMode="login";
const $=id=>document.getElementById(id);
function showMessage(msg,ok=false){const el=$("statusMessage");el.textContent=msg;el.className="status "+(ok?"ok":"error");el.style.display="block"}
function clearStatus(){$("statusMessage").style.display="none"}
function switchMode(mode){
 currentMode=mode; clearStatus();
 const signup=document.querySelectorAll(".signup-only"), pg=$("passwordGroup"), pass=$("password");
 $("fullName").required=mode==="signup"; pass.required=mode!=="reset";
 signup.forEach(x=>x.style.display=mode==="signup"?"block":"none"); pg.style.display=mode==="reset"?"none":"block";
 if(mode==="signup"){$("cardSubtitle").textContent="إنشاء حساب جديد";$("submitBtn").textContent="إنشاء الحساب";$("toggleBtn").textContent="لديك حساب بالفعل؟ تسجيل الدخول";$("resetBtn").style.display="none"}
 else if(mode==="reset"){$("cardSubtitle").textContent="استعادة كلمة المرور";$("submitBtn").textContent="إرسال رابط إعادة التعيين";$("toggleBtn").textContent="العودة لتسجيل الدخول";$("resetBtn").style.display="none"}
 else{$("cardSubtitle").textContent="تسجيل الدخول للموقع";$("submitBtn").textContent="تسجيل الدخول";$("toggleBtn").textContent="إنشاء حساب جديد";$("resetBtn").style.display="block"}
}
$("showPass").onclick=()=>{const p=$("password");p.type=p.type==="password"?"text":"password";$("showPass").textContent=p.type==="password"?"إظهار":"إخفاء"};
$("toggleBtn").onclick=()=>switchMode(currentMode==="login"?"signup":"login");
$("resetBtn").onclick=()=>switchMode("reset");
function getSafeNext(){
 const raw=new URLSearchParams(location.search).get("next");
 if(!raw)return "index.html#subjects";
 try{
   const url=new URL(raw, location.href);
   if(url.origin===location.origin) return url.href;
 }catch(_){}
 return "index.html#subjects";
}

window.addEventListener("DOMContentLoaded",async()=>{
 try{
   client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
   const {data:{session}}=await client.auth.getSession();
   if(session?.user) window.location.replace(getSafeNext());
 }catch(e){showMessage("تعذر تهيئة خدمة الحسابات.");}
});
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault(); clearStatus(); $("submitBtn").disabled=true;
 try{
  if(!client) client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const email=$("email").value.trim(), password=$("password").value;
  if(currentMode==="login"){
   $("submitBtn").textContent="جاري التحقق...";
   const {data,error}=await client.auth.signInWithPassword({email,password});
   if(error) throw error;
   window.location.replace(getSafeNext()); return;
  }
  if(currentMode==="signup"){
   $("submitBtn").textContent="جاري إنشاء الحساب...";
   const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:$("fullName").value.trim(),phone:$("phone").value.trim(),grade:$("grade").value}}});
   if(error) throw error;
   if(data.session) {showMessage("تم إنشاء الحساب وتسجيل الدخول بنجاح.",true);setTimeout(()=>window.location.replace(getSafeNext()),600)}
   else {showMessage("تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.",true);setTimeout(()=>switchMode("login"),1800)}
   return;
  }
  $("submitBtn").textContent="جاري الإرسال...";
  const redirectUrl=new URL("reset-password.html",location.href);
  const next=getSafeNext();
  if(next!=="index.html#subjects") redirectUrl.searchParams.set("next",next);
  const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl.href});
  if(error) throw error;
  showMessage("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك.",true);
 }catch(err){
  const msg=err?.message||"حدث خطأ غير متوقع.";
  showMessage(currentMode==="login"?"البريد أو كلمة المرور غير صحيحة.":msg);
 }finally{if(!($("submitBtn").textContent==="تم")){$("submitBtn").disabled=false;if(currentMode==="login")$("submitBtn").textContent="تسجيل الدخول";else if(currentMode==="signup")$("submitBtn").textContent="إنشاء الحساب";else $("submitBtn").textContent="إرسال رابط إعادة التعيين"}}
});
</script>
</body>
</html>
