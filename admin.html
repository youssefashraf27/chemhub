<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة | ChemistryHub</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script>
<style>.admin-wrap{padding:50px 0}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}.stat{background:var(--card,#fff);border:1px solid #e3e9ef;border-radius:18px;padding:20px}.stat b{font-size:30px;display:block;color:#07866c}.table-wrap{overflow:auto;background:var(--card,#fff);border-radius:18px;border:1px solid #e3e9ef}.users{width:100%;border-collapse:collapse;min-width:750px}.users th,.users td{padding:13px;border-bottom:1px solid #edf0f3;text-align:right}.users select,.users input{padding:8px;border:1px solid #dce3ea;border-radius:8px;font-family:inherit;background:inherit;color:inherit}.admin-msg{margin:12px 0;color:#07866c}.admin-error{color:#c53b3b}.danger{background:#fff0f0;color:#c53b3b;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}@media(max-width:700px){.stats{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}</style>
</head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>لوحة الإدارة</small></span></a><div style="display:flex;gap:8px"><a class="btn ghost" href="index.html">الموقع</a><button class="btn small" onclick="logout()">خروج</button></div></div></header>
<main class="admin-wrap"><div class="container">
<div class="admin-head"><div><span class="eyebrow">Administration</span><h1>لوحة الإدارة</h1><p>إدارة بيانات المستخدمين وصلاحياتهم.</p></div><button class="btn primary" id="refreshBtn">تحديث</button></div>
<div id="message" class="admin-msg"></div><div class="stats"><div class="stat"><span>إجمالي المستخدمين</span><b id="total">—</b></div><div class="stat"><span>الطلاب</span><b id="students">—</b></div><div class="stat"><span>المديرون</span><b id="admins">—</b></div></div>
<div class="table-wrap"><table class="users"><thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الفرقة</th><th>الصلاحية</th><th>إجراء</th></tr></thead><tbody id="usersBody"><tr><td colspan="6">جاري التحميل...</td></tr></tbody></table></div>
</div></main>
<script>
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let currentUser;
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function boot(){try{currentUser=await getCurrentUser();if(!currentUser){location.href="login.html";return}
 const {data:me,error}=await client.from("profiles").select("role").eq("id",currentUser.id).single();
 if(error||me?.role!=="admin"){document.body.innerHTML='<main class="section"><div class="container"><div class="card" style="text-align:center"><h2>غير مصرح بالدخول</h2><p>هذه الصفحة مخصصة للمديرين فقط.</p><a class="btn primary" href="index.html">العودة للموقع</a></div></div></main>';return}
 loadUsers();
}catch(e){$("message").textContent="تعذر التحقق من صلاحيات المدير.";$("message").className="admin-msg admin-error"}}
async function loadUsers(){const {data,error}=await client.from("profiles").select("id,full_name,email,phone,grade,role,created_at").order("created_at",{ascending:false});if(error){$("message").textContent="تأكد من تشغيل ملف supabase.sql في مشروع Supabase. "+error.message;$("message").className="admin-msg admin-error";return}
 $("total").textContent=data.length;$("students").textContent=data.filter(x=>x.role!=="admin").length;$("admins").textContent=data.filter(x=>x.role==="admin").length;
 $("usersBody").innerHTML=data.map(u=>`<tr data-id="${esc(u.id)}"><td>${esc(u.full_name||"—")}</td><td>${esc(u.email||"—")}</td><td>${esc(u.phone||"—")}</td><td>${esc(u.grade||"—")}</td><td><select class="role"><option value="student" ${u.role==="student"?"selected":""}>طالب</option><option value="admin" ${u.role==="admin"?"selected":""}>مدير</option></select></td><td><button class="btn small save">حفظ</button></td></tr>`).join("");
 document.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{const row=b.closest("tr"),id=row.dataset.id,role=row.querySelector(".role").value;b.disabled=true;const {error}=await client.from("profiles").update({role}).eq("id",id);b.disabled=false;if(error)alert(error.message);else loadUsers()});
}
$("refreshBtn").onclick=loadUsers;boot();
</script></body></html>
