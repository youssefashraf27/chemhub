<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>تغيير كلمة المرور | ChemistryHub"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.box{width:min(420px,100%);background:#1e293b;padding:30px;border-radius:18px;box-sizing:border-box;box-shadow:0 20px 50px #0008}.box input,.box button{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #334155;box-sizing:border-box}.box input{background:#0f172a;color:#fff}.box button{background:#0284c7;color:#fff;border:0;font-weight:bold;cursor:pointer}.box button:disabled{opacity:.55;cursor:not-allowed}.msg{text-align:center;min-height:22px}.msg.ok{color:#4ade80}.msg.error{color:#f87171}.hint{color:#94a3b8;font-size:.9rem;line-height:1.6}</style></head>
<body><div class="box"><h2>تعيين كلمة مرور جديدة</h2><p class="hint">أدخل كلمة مرور جديدة لا تقل عن 6 أحرف.</p><form id="form"><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="كلمة المرور الجديدة"><input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="تأكيد كلمة المرور"><button id="submit" type="submit">حفظ كلمة المرور</button><p id="msg" class="msg" role="status"></p></form></div><script>
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const form=document.getElementById("form"),password=document.getElementById("password"),confirmPassword=document.getElementById("confirm"),msg=document.getElementById("msg"),submit=document.getElementById("submit");
const nextParam=new URLSearchParams(location.search).get("next");
function destination(){try{const u=new URL(nextParam||"index.html#subjects",location.href);return u.origin===location.origin?u.href:"index.html#subjects";}catch(_){return "index.html#subjects";}}
function show(text,ok=false){msg.textContent=text;msg.className="msg "+(ok?"ok":"error");}
let recoveryReady=false;
async function init(){
  const {data:{session}}=await client.auth.getSession();
  recoveryReady=!!session;
  if(!recoveryReady) show("رابط إعادة التعيين غير صالح أو انتهت صلاحيته.");
}
client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){recoveryReady=true;show("يمكنك الآن اختيار كلمة مرور جديدة.",true);}});
form.onsubmit=async e=>{
 e.preventDefault();
 if(!recoveryReady){show("افتح رابط إعادة التعيين من بريدك الإلكتروني مرة أخرى.");return;}
 const p=password.value;
 if(p.length<6){show("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");return;}
 if(p!==confirmPassword.value){show("كلمتا المرور غير متطابقتين.");return;}
 submit.disabled=true;submit.textContent="جاري الحفظ...";
 const {error}=await client.auth.updateUser({password:p});
 if(error){show(error.message);submit.disabled=false;submit.textContent="حفظ كلمة المرور";return;}
 show("تم تغيير كلمة المرور بنجاح.",true);
 await client.auth.signOut();
 setTimeout(()=>location.replace(destination()),900);
};
init();
</script></body></html>
