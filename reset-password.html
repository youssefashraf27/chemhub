<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة المرور | ChemistryHub"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:Arial;background:#0f172a;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.box{width:min(400px,90%);background:#1e293b;padding:30px;border-radius:18px}.box input,.box button{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #334155;box-sizing:border-box}.box input{background:#0f172a;color:#fff}.box button{background:#0284c7;color:#fff;border:0;font-weight:bold;cursor:pointer}.msg{text-align:center;color:#4ade80}</style></head><body><div class="box"><h2>تعيين كلمة مرور جديدة</h2><form id="form"><input id="password" type="password" minlength="6" required placeholder="كلمة المرور الجديدة"><input id="confirm" type="password" minlength="6" required placeholder="تأكيد كلمة المرور"><button>حفظ كلمة المرور</button><p id="msg" class="msg"></p></form></div><script>
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const form=document.getElementById("form");form.onsubmit=async e=>{e.preventDefault();const p=password.value;if(p!==confirm.value)return msg.textContent="كلمتا المرور غير متطابقتين.";const {error}=await client.auth.updateUser({password:p});if(error)msg.textContent=error.message;else{msg.textContent="تم تغيير كلمة المرور بنجاح.";setTimeout(()=>location.href="index.html",1000)}};
</script></body></html>
