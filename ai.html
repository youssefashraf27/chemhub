<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>المساعد الذكي | ChemistryHub</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f8;
    }

    /* =========================
       الصفحة
    ========================= */

    .ai-layout {
      height: calc(100vh - 67px);
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      margin: auto;
      position: relative;
    }


    /* =========================
       عنوان المحادثة
    ========================= */

    .ai-header {
      text-align: center;
      padding: 24px 20px 10px;
      flex-shrink: 0;
    }

    .ai-header h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
    }

    .ai-header p {
      margin: 7px 0 0;
      color: #777;
      font-size: 14px;
    }


    /* =========================
       منطقة الرسائل
    ========================= */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 25px 170px;
      scroll-behavior: smooth;
    }


    .message-row {
      display: flex;
      width: 100%;
      margin: 22px 0;
    }

    .message-row.user {
      justify-content: flex-start;
    }

    .message-row.assistant {
      justify-content: flex-end;
    }


    .message-content {
      max-width: 75%;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }


    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: #e6f4ef;
    }


    .message-row.user .avatar {
      order: 2;
      background: #07866c;
      color: white;
    }


    .bubble {
      line-height: 1.9;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }


    .message-row.user .bubble {
      background: #07866c;
      color: white;
      padding: 11px 16px;
      border-radius: 18px 18px 4px 18px;
    }


    .message-row.assistant .bubble {
      padding: 5px 0;
      color: #222;
    }


    /* =========================
       رسالة الترحيب
    ========================= */

    .welcome {
      max-width: 700px;
      margin: 45px auto;
      text-align: center;
    }


    .welcome-icon {
      width: 65px;
      height: 65px;
      margin: auto auto 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6f4ef;
      font-size: 34px;
    }


    .welcome h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }


    .welcome p {
      color: #777;
      margin: 0;
      line-height: 1.8;
    }


    /* =========================
       منطقة الكتابة
    ========================= */

    .composer-wrapper {
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      padding: 20px 25px 25px;

      background: linear-gradient(
        to bottom,
        rgba(247,247,248,0),
        #f7f7f8 25%
      );
    }


    .composer {
      max-width: 850px;
      margin: auto;

      background: white;
      border: 1px solid #d9d9df;
      border-radius: 22px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.07);

      padding: 9px 10px;

      display: flex;
      align-items: flex-end;
      gap: 8px;
    }


    /* =========================
       زر المرفقات
    ========================= */

    .attach-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;

      border: 0;
      border-radius: 12px;

      background: transparent;

      cursor: pointer;

      font-size: 22px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .attach-btn:hover {
      background: #f0f0f2;
    }


    #fileInput {
      display: none;
    }


    /* =========================
       حقل الكتابة
    ========================= */

    #message {
      flex: 1;

      border: 0;
      outline: 0;

      resize: none;

      min-height: 42px;
      max-height: 150px;

      padding: 10px 5px;

      font-family: inherit;
      font-size: 15px;

      background: transparent;

      color: #222;
    }


    #message::placeholder {
      color: #999;
    }


    /* =========================
       زر الإرسال
    ========================= */

    .send-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;

      border: 0;
      border-radius: 50%;

      background: #07866c;
      color: white;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
    }


    .send-btn:hover {
      opacity: .9;
    }


    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }


    /* =========================
       معاينة الملف
    ========================= */

    .attachment-preview {
      display: none;

      max-width: 850px;
      margin: 0 auto 8px;

      padding: 8px 12px;

      background: white;

      border: 1px solid #ddd;

      border-radius: 12px;

      align-items: center;

      gap: 10px;
    }


    .attachment-preview.active {
      display: flex;
    }


    .attachment-thumb {
      width: 42px;
      height: 42px;

      border-radius: 8px;

      overflow: hidden;

      background: #f1f1f1;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .attachment-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .attachment-info {
      flex: 1;
      min-width: 0;
    }


    .attachment-name {
      font-size: 13px;
      font-weight: 700;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .attachment-size {
      font-size: 11px;
      color: #888;
    }


    .remove-attachment {
      border: 0;
      background: transparent;

      font-size: 22px;

      cursor: pointer;

      color: #888;
    }


    /* =========================
       حالة الإرسال
    ========================= */

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      color: #888;
      font-size: 13px;
    }


    .typing.active {
      display: flex;
    }


    .typing span {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #888;

      animation: typing 1.2s infinite;
    }


    .typing span:nth-child(2) {
      animation-delay: .15s;
    }


    .typing span:nth-child(3) {
      animation-delay: .3s;
    }


    @keyframes typing {

      0%,60%,100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }

    }


    /* =========================
       الموبايل
    ========================= */

    @media(max-width:700px) {

      .ai-layout {
        height: calc(100vh - 60px);
      }

      .ai-header {
        padding: 18px 12px 5px;
      }

      .ai-header h1 {
        font-size: 21px;
      }

      .chat-area {
        padding:
          15px
          12px
          160px;
      }

      .message-content {
        max-width: 90%;
      }

      .composer-wrapper {
        padding:
          12px
          10px
          15px;
      }

      .composer {
        border-radius: 18px;
      }

    }


  </style>

</head>


<body>


<header class="topbar">

  <div class="container nav">

    <a class="brand" href="index.html">

      <span class="brand-icon">
        🧪
      </span>

      <span>
        ChemistryHub
        <small>المساعد الذكي</small>
      </span>

    </a>


    <div id="accountBox"></div>

  </div>

</header>



<div class="ai-layout">


  <!-- العنوان -->

  <div class="ai-header">

    <h1>
      🤖 المساعد الذكي
    </h1>

    <p>
      اسألني عن الكيمياء أو ارفع صورة أو ملف PDF
    </p>

  </div>



  <!-- المحادثة -->

  <div
    id="chatArea"
    class="chat-area"
  >


    <div
      id="welcome"
      class="welcome"
    >

      <div class="welcome-icon">
        🧪
      </div>

      <h2>
        كيف يمكنني مساعدتك؟
      </h2>

      <p>
        اكتب سؤالك أو أرفق صورة لمسألة أو ملف PDF
        وسأساعدك في فهمه وحله.
      </p>

    </div>


  </div>



  <!-- منطقة الكتابة -->

  <div class="composer-wrapper">


    <!-- الملف المرفق -->

    <div
      id="attachmentPreview"
      class="attachment-preview"
    >

      <div
        id="attachmentThumb"
        class="attachment-thumb"
      ></div>


      <div class="attachment-info">

        <div
          id="attachmentName"
          class="attachment-name"
        ></div>

        <div
          id="attachmentSize"
          class="attachment-size"
        ></div>

      </div>


      <button
        id="removeAttachment"
        class="remove-attachment"
        type="button"
      >
        ×
      </button>

    </div>



    <!-- مؤشر الكتابة -->

    <div
      id="typing"
      class="typing"
    >

      <span></span>
      <span></span>
      <span></span>

      جاري التفكير...

    </div>



    <!-- صندوق الكتابة -->

    <form
      id="aiForm"
      class="composer"
    >


      <label
        for="fileInput"
        class="attach-btn"
        title="إرفاق ملف أو صورة"
      >
        📎
      </label>


      <input
        id="fileInput"
        type="file"
        accept=".pdf,image/jpeg,image/png,image/webp,application/pdf"
      >


      <textarea
        id="message"
        rows="1"
        placeholder="اكتب رسالتك..."
      ></textarea>


      <button
        id="send"
        class="send-btn"
        type="submit"
        title="إرسال"
      >
        ↑
      </button>


    </form>


    <div
      style="
        text-align:center;
        font-size:11px;
        color:#999;
        margin-top:8px;
      "
    >
      قد تحتاج إجابات الذكاء الاصطناعي إلى مراجعة من مصدر علمي.
    </div>


  </div>


</div>



<script>


const client =
  window.supabaseClient ||
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


window.supabaseClient = client;



const $ =
  selector =>
    document.querySelector(selector);



let selectedFile = null;



/* =========================
   حجم الملف
========================= */

function formatSize(bytes) {

  if(bytes < 1024)
    return bytes + " B";

  if(bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  return (bytes / 1024 / 1024).toFixed(1) + " MB";

}



/* =========================
   إضافة رسالة
========================= */

function addMessage(text,type) {


  const row =
    document.createElement("div");


  row.className =
    "message-row " + type;


  const content =
    document.createElement("div");


  content.className =
    "message-content";


  const avatar =
    document.createElement("div");


  avatar.className =
    "avatar";


  avatar.textContent =
    type === "user"
      ? "👤"
      : "🤖";


  const bubble =
    document.createElement("div");


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  content.appendChild(avatar);

  content.appendChild(bubble);

  row.appendChild(content);


  $("#welcome")?.remove();


  $("#chatArea").appendChild(row);


  $("#chatArea").scrollTop =
    $("#chatArea").scrollHeight;

}



/* =========================
   معاينة الملف
========================= */

function showFile(file) {


  $("#attachmentName").textContent =
    file.name;


  $("#attachmentSize").textContent =
    formatSize(file.size);


  const thumb =
    $("#attachmentThumb");


  thumb.innerHTML = "";


  if(file.type.startsWith("image/")) {

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);

    thumb.appendChild(img);

  } else {

    thumb.textContent =
      "📄";

    thumb.style.fontSize =
      "22px";

  }


  $("#attachmentPreview")
    .classList.add("active");

}



/* =========================
   حذف الملف
========================= */

function clearFile() {

  selectedFile = null;

  $("#fileInput").value = "";

  $("#attachmentPreview")
    .classList.remove("active");

  $("#attachmentThumb").innerHTML = "";

}



/* =========================
   اختيار ملف
========================= */

$("#fileInput").addEventListener(
  "change",
  function() {


    const file =
      this.files?.[0];


    if(!file)
      return;


    const allowed = [

      "application/pdf",

      "image/jpeg",

      "image/png",

      "image/webp"

    ];


    if(!allowed.includes(file.type)) {

      alert(
        "يسمح فقط بـ PDF أو JPG أو PNG أو WEBP."
      );

      clearFile();

      return;

    }


    if(file.size > 5 * 1024 * 1024) {

      alert(
        "الحد الأقصى لحجم الملف هو 5MB."
      );

      clearFile();

      return;

    }


    selectedFile =
      file;


    showFile(file);

  }
);



$("#removeAttachment").onclick =
  clearFile;



/* =========================
   تحويل الملف Base64
========================= */

function fileToBase64(file) {

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        ()=>{

          const result =
            String(reader.result);


          resolve(
            result.split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}



/* =========================
   تكبير textarea
========================= */

$("#message").addEventListener(
  "input",
  function(){

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        150
      ) + "px";

  }
);



/* =========================
   Enter للإرسال
========================= */

$("#message").addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      $("#aiForm").requestSubmit();

    }

  }
);



/* =========================
   تشغيل المساعد
========================= */

async function boot() {


  if(!(await protectPage()))
    return;


  await setupAuthUI();



  $("#aiForm").addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const input =
        $("#message");

      const button =
        $("#send");

      const typing =
        $("#typing");


      const message =
        input.value.trim();


      if(!message && !selectedFile){

        input.focus();

        return;

      }


      button.disabled =
        true;


      let filePayload =
        null;


      try {


        /* تجهيز الملف */

        if(selectedFile){

          filePayload = {

            name:
              selectedFile.name,

            type:
              selectedFile.type,

            data:
              await fileToBase64(
                selectedFile
              )

          };

        }



        /* رسالة المستخدم */

        addMessage(

          message ||
          "حلل الملف المرفق واشرحه لي.",

          "user"

        );


        input.value = "";

        input.style.height =
          "auto";


        typing.classList.add(
          "active"
        );


        $("#chatArea").scrollTop =
          $("#chatArea").scrollHeight;



        /* استدعاء Gemini */

        const {
          data,
          error
        } =
          await client.functions.invoke(

            "chemistry-ai",

            {

              body: {

                message:
                  message ||
                  "حلل الملف المرفق واشرحه لي بطريقة تعليمية.",

                file:
                  filePayload

              }

            }

          );


        if(error)
          throw error;


        if(
          !data ||
          !data.answer
        ){

          throw new Error(
            data?.error ||
            "لم يصل رد من المساعد."
          );

        }


        addMessage(
          data.answer,
          "assistant"
        );


        clearFile();


      }catch(error){


        console.error(
          "AI ERROR:",
          error
        );


        addMessage(

          "❌ حدث خطأ أثناء الاتصال بالمساعد. تأكد من أن Edge Function باسم chemistry-ai منشورة وأن GEMINI_API_KEY موجود في Secrets.",

          "assistant"

        );


      }finally{


        typing.classList.remove(
          "active"
        );


        button.disabled =
          false;


        input.focus();

      }

    }
  );

}



boot();


</script>


</body>

</html>
