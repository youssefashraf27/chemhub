<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاختبارات | ChemistryHub"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><style>.quiz-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.quiz-card{padding:22px}.quiz-card .btn{margin-top:12px}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>الاختبارات</small></span></a><div id="accountBox"></div></div></header><main class="section"><div class="container"><div class="section-head"><span class="eyebrow">Student Tools</span><h1>بنك الاختبارات</h1><p>الاختبارات يتم إنشاؤها وتعديلها من لوحة الإدارة.</p></div><div id="list" class="quiz-list"></div></div></main><script>const c=window.supabaseClient||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);window.supabaseClient=c;const esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[z]));async function boot(){if(!(await protectPage()))return;setupAuthUI();const {data,error}=await c.from('quizzes').select('id,title,description,subjects(name),quiz_questions(id)').eq('active',true).order('created_at',{ascending:false});if(error){list.innerHTML='<div class="card">تعذر تحميل الاختبارات.</div>';return}list.innerHTML=(data||[]).map(q=>`<article class="quiz-card card"><div class="card-icon">📝</div><h3>${esc(q.title)}</h3><p>${esc(q.description||q.subjects?.name||'اختبار')}</p><small>${(q.quiz_questions||[]).length} أسئلة</small><br><a class="btn small" href="quiz.html?id=${q.id}">ابدأ الاختبار</a></article>`).join('')||'<div class="card">لا توجد اختبارات متاحة حالياً.</div>';}boot();</script></body></html>
