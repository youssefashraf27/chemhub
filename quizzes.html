<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاختبارات | ChemistryHub</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.quiz-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.quiz-card{padding:22px}</style><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>الاختبارات</small></span></a><div id="accountBox"></div></div></header><main class="section"><div class="container"><div class="section-head"><span class="eyebrow">Student Tools</span><h1>بنك الاختبارات</h1><p>اختبارات أنشأها المدير ويمكن تحديثها من لوحة الإدارة.</p></div><div id="list" class="quiz-list"></div></div></main><script>const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[z]));async function boot(){if(!(await protectPage()))return;await setupAuthUI();const r=await c.from('ch_quizzes').select('id,title,description,ch_subjects(name),ch_quiz_questions(id)').eq('active',true).order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="card">تعذر تحميل الاختبارات.</div>';return}list.innerHTML=(r.data||[]).map(q=>`<article class="quiz-card card"><div class="card-icon">📝</div><h3>${esc(q.title)}</h3><p>${esc(q.description||q.ch_subjects?.name||'اختبار')}</p><small>${(q.ch_quiz_questions||[]).length} أسئلة</small><br><a class="btn small" href="quiz.html?id=${q.id}">ابدأ الاختبار</a></article>`).join('')||'<div class="card">لا توجد اختبارات متاحة حالياً.</div>}boot();</script></body></html>
