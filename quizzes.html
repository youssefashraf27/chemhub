<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاختبارات | ChemistryHub</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.quiz-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.quiz-card{padding:22px}</style><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>الاختبارات</small></span></a><div id="accountBox"></div></div></header><main class="section"><div class="container"><div class="section-head"><span class="eyebrow">Student Tools</span><h1>بنك الاختبارات</h1><p>اختبارات أنشأها المدير ويمكن تحديثها من لوحة الإدارة.</p></div><div id="list" class="quiz-list"></div></div></main><script>
const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[z]));
async function boot(){
  if(!(await protectPage())) return;
  const user=await setupAuthUI();
  const box=document.getElementById('list');
  box.innerHTML='<div class="card">جاري تحميل الاختبارات...</div>';

  const r=await c.from('ch_quizzes')
    .select('id,title,description,subject_id,created_at,active,ch_subjects(name,ch_years(year_number,title))')
    .eq('active',true)
    .order('created_at',{ascending:false});

  if(r.error){
    console.error('quizzes load error:',r.error);
    box.innerHTML='<div class="card">تعذر تحميل الاختبارات: '+esc(r.error.message)+'</div>';
    return;
  }

  const grade=String(user?.profile?.grade||'').trim();
  const yearMatch=grade.match(/(?:Year\s*)?([1-4])/i);
  const studentYear=yearMatch ? Number(yearMatch[1]) : null;

  // الطالب يرى فقط الاختبارات المرتبطة بمواد فرقته.
  // الاختبار العام (بدون مادة) لا يظهر للطلاب حتى لا تختلط اختبارات الفرق.
  const quizzes=(r.data||[]).filter(q=>{
    const yearNumber=Number(q.ch_subjects?.ch_years?.year_number);
    return studentYear && yearNumber===studentYear;
  });

  if(!quizzes.length){
    box.innerHTML='<div class="card">لا توجد اختبارات متاحة حالياً.</div>';
    return;
  }

  const ids=quizzes.map(q=>q.id);
  const qr=await c.from('ch_quiz_questions').select('id,quiz_id').in('quiz_id',ids);
  if(qr.error){
    console.error('questions count error:',qr.error);
  }
  const counts={};
  (qr.data||[]).forEach(x=>counts[x.quiz_id]=(counts[x.quiz_id]||0)+1);

  box.innerHTML=quizzes.map(q=>`<article class="quiz-card card">
    <div class="card-icon">📝</div>
    <h3>${esc(q.title)}</h3>
    <p>${esc(q.description||'اختبار')}</p>
    <small>${counts[q.id]||0} أسئلة</small><br>
    <a class="btn small" href="quiz.html?id=${encodeURIComponent(q.id)}">ابدأ الاختبار</a>
  </article>`).join('');
}
boot();
</script></body></html>
