<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المادة | ChemistryHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .subject-page{min-height:75vh;padding:55px 0 80px}
    .back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:25px;text-decoration:none;font-weight:700}
    .subject-hero{text-align:center;margin-bottom:35px}
    .subject-big-icon{width:90px;height:90px;margin:0 auto 18px;display:grid;place-items:center;border-radius:25px;font-size:45px;background:var(--card,#fff);box-shadow:0 12px 35px rgba(0,0,0,.10)}
    .files-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
    .file-card{display:flex;align-items:center;gap:15px;padding:22px;border-radius:20px;text-decoration:none;color:inherit;background:var(--card,#fff);border:1px solid rgba(0,0,0,.07);box-shadow:0 8px 25px rgba(0,0,0,.06);transition:.2s ease}
    .file-card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.10)}
    .file-icon{width:55px;height:55px;flex:0 0 55px;display:grid;place-items:center;border-radius:16px;background:rgba(220,38,38,.10);font-size:28px}
    .file-card strong{display:block;margin-bottom:5px}
    .file-card small{opacity:.7}
    .empty-files{text-align:center;padding:35px 20px;border-radius:20px;background:var(--card,#fff);box-shadow:0 8px 25px rgba(0,0,0,.06)}
    .error-box{text-align:center;padding:50px 20px}
  </style>
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>كلية التربية • قسم الكيمياء</small></span></a>
    <a class="back-link" href="index.html#subjects">→ العودة</a>
    <button class="theme-btn" id="themeBtn" title="الوضع الليلي">☾</button>
  </div>
</header>

<main class="subject-page">
  <div class="container">
    <div id="subjectContent"></div>
  </div>
</main>

<footer>
  <div class="container footer">
    <div><b>🧪 ChemistryHub</b><p>كلية التربية • قسم الكيمياء</p></div>
    <span>© <span id="year"></span> ChemistryHub</span>
  </div>
</footer>

<script src="data.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();

document.getElementById("themeBtn").addEventListener("click",()=>{
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("chemistryTheme",document.documentElement.classList.contains("dark")?"dark":"light");
});

if(localStorage.getItem("chemistryTheme")==="dark"){
  document.documentElement.classList.add("dark");
}

const params = new URLSearchParams(window.location.search);
const subjectName = params.get("subject");
const content = document.getElementById("subjectContent");

if(!subjectName){
  content.innerHTML = `
    <div class="card error-box">
      <h2>لم يتم اختيار مادة</h2>
      <p>ارجع للصفحة الرئيسية واختر المادة.</p>
    </div>
  `;
}else{
  document.title = `${subjectName} | ChemistryHub`;
  const files = subjectFiles[subjectName] || [];

  let filesHTML = "";

  if(files.length){
    filesHTML = `
      <div class="files-grid">
        ${files.map(file=>`
          <a class="file-card" href="${file.file}" target="_blank" rel="noopener">
            <span class="file-icon">📄</span>
            <span>
              <strong>${file.title}</strong>
              <small>فتح ملف PDF</small>
            </span>
          </a>
        `).join("")}
      </div>
    `;
  }else{
    filesHTML = `
      <div class="empty-files">
        <div style="font-size:45px">📂</div>
        <h3>لا توجد ملفات مضافة بعد</h3>
      </div>
    `;
  }

  content.innerHTML = `
    <div class="subject-hero">
      <div class="subject-big-icon">📚</div>
      <span class="eyebrow">Study Materials</span>
      <h1>${subjectName}</h1>
      <p>المحاضرات والملفات الخاصة بالمادة</p>
    </div>
    ${filesHTML}
  `;
}
</script>
</body>
</html>
