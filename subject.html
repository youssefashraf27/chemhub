<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المادة | ChemistryHub"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.subject-page{min-height:75vh;padding:55px 0 80px}.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:25px;text-decoration:none;font-weight:700}.subject-hero{text-align:center;margin-bottom:35px}.subject-big-icon{width:90px;height:90px;margin:0 auto 18px;display:grid;place-items:center;border-radius:25px;font-size:45px;background:var(--card,#fff);box-shadow:0 12px 35px rgba(0,0,0,.10)}.files-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.file-card{display:flex;align-items:center;gap:15px;padding:22px;border-radius:20px;text-decoration:none;color:inherit;background:var(--card,#fff);border:1px solid rgba(0,0,0,.07);box-shadow:0 8px 25px rgba(0,0,0,.06);transition:.2s ease}.file-card:hover{transform:translateY(-4px)}.file-icon{width:55px;height:55px;display:grid;place-items:center;border-radius:16px;background:rgba(220,38,38,.10);font-size:28px}.file-card strong{display:block;margin-bottom:5px}.file-card small{opacity:.7}.empty-files{text-align:center;padding:35px 20px;border-radius:20px;background:var(--card,#fff)}.error-box{text-align:center;padding:50px 20px}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>كلية التربية • قسم الكيمياء</small></span></a><div id="accountBox"></div><a class="back-link" href="index.html#subjects">→ العودة</a><button class="theme-btn" id="themeBtn">☾</button></div></header><main class="subject-page"><div class="container"><div id="subjectContent"></div></div></main><footer><div class="container footer"><div><b>🧪 ChemistryHub</b><p>كلية التربية • قسم الكيمياء</p></div><span>© <span id="year"></span> ChemistryHub</span></div></footer><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>const c=window.supabaseClient||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);window.supabaseClient=c;const esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[z]));document.getElementById('year').textContent=new Date().getFullYear();if(localStorage.getItem('chemistryTheme')==='dark')document.documentElement.classList.add('dark');document.getElementById('themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('chemistryTheme',document.documentElement.classList.contains('dark')?'dark':'light')};async function boot(){if(!(await protectPage()))return;setupAuthUI();const id=new URLSearchParams(location.search).get('subject');if(!id)return;const {data:s,error}=await c.from('subjects').select('*').eq('id',id).single();if(error){document.getElementById('subjectContent').innerHTML='<div class="card error-box"><h2>المادة غير موجودة</h2></div>';return}const {data:ms}=await c.from('materials').select('*').eq('subject_id',id).order('created_at',{ascending:false});document.title=s.name+' | ChemistryHub';const links=[];for(const m of (ms||[])){const r=await c.storage.from('chemistry-files').createSignedUrl(m.storage_path,900);if(!r.error)links.push({...m,url:r.data.signedUrl})}document.getElementById('subjectContent').innerHTML=`<div class="subject-hero"><div class="subject-big-icon">📚</div><span class="eyebrow">الفرقة ${s.year} • ${esc(s.semester)}</span><h1>${esc(s.name)}</h1><p>${esc(s.description||'المحاضرات والملفات الخاصة بالمادة')}</p></div>${links.length?'<div class="files-grid">'+links.map(f=>`<a class="file-card" href="${f.url}" target="_blank" rel="noopener"><span class="file-icon">📄</span><span><strong>${esc(f.title)}</strong><small>فتح الملف</small></span></a>`).join('')+'</div>':'<div class="empty-files"><div style="font-size:45px">📂</div><h3>لا توجد ملفات مضافة بعد</h3></div>'}`;}boot();</script></body></html>
