<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المادة | ChemistryHub</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.subject-page{min-height:75vh;padding:55px 0 80px}.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:25px;text-decoration:none;font-weight:700}.files-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.file-card{display:flex;align-items:center;gap:15px;padding:22px;border-radius:20px;text-decoration:none;color:inherit;background:var(--card,#fff);border:1px solid rgba(0,0,0,.07);box-shadow:0 8px 25px rgba(0,0,0,.06);transition:.2s}.file-card:hover{transform:translateY(-4px)}.file-icon{width:55px;height:55px;display:grid;place-items:center;border-radius:16px;background:rgba(220,38,38,.1);font-size:28px}.empty-files{text-align:center;padding:35px 20px;border-radius:20px;background:var(--card,#fff)}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>كلية التربية • قسم الكيمياء</small></span></a><div id="accountBox"></div><a class="back-link" href="index.html#subjects">→ العودة</a><button class="theme-btn" id="themeBtn">☾</button></div></header><main class="subject-page"><div class="container"><div id="subjectContent"></div></div></main><footer><div class="container footer"><div><b>🧪 ChemistryHub</b><p>كلية التربية • قسم الكيمياء</p></div><span>© <span id="year"></span> ChemistryHub</span></div></footer><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function boot(){if(!(await protectPage()))return;await setupAuthUI();const id=new URLSearchParams(location.search).get('subject'),box=document.getElementById('subjectContent');if(!id){box.innerHTML='<div class="card"><h2>لم يتم اختيار مادة.</h2></div>';return}const me=await getCurrentUser(); const privileged=isAdmin(me); const subjectQuery=c.from('ch_subjects').select('*,ch_years(title)').eq('id',id); if(!privileged) subjectQuery.eq('active',true); const s=await subjectQuery.single();if(s.error){box.innerHTML='<div class="card"><h2>المادة غير موجودة.</h2></div>';return}document.title=s.data.name+' | ChemistryHub';const r=await c.from('ch_materials').select('*').eq('subject_id',id).order('created_at',{ascending:false});let files='';for(const f of (r.data||[])){const u=await c.storage.from('chemistryhub-files').createSignedUrl(f.storage_path,1800);if(!u.error)files+=`<a class="file-card" href="${u.data.signedUrl}" target="_blank" rel="noopener"><span class="file-icon">📄</span><span><strong>${esc(f.title)}</strong><small>فتح الملف • ${esc(f.file_name||'PDF')}</small></span></a>`}box.innerHTML=`<div class="subject-hero"><div class="subject-big-icon">📚</div><span class="eyebrow">${esc(s.data.ch_years?.title||'Study Materials')}</span><h1>${esc(s.data.name)}</h1><p>${esc(s.data.description||'المحاضرات والملفات الخاصة بالمادة')}</p></div>${files?`<div class="files-grid">${files}</div>`:'<div class="empty-files"><div style="font-size:45px">📂</div><h3>لا توجد ملفات مضافة بعد</h3><p>يمكن للمدير إضافة الملفات من لوحة الإدارة.</p></div>'}`};document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('chemistryTheme',document.documentElement.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('chemistryTheme')==='dark')document.documentElement.classList.add('dark');boot();</script></body></html>
