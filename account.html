<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="حساب الطالب - ChemistryHub">
<title>حسابي | ChemistryHub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.account-page{padding:45px 0 80px}
.account-grid{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.account-card{padding:25px}
.profile-card{text-align:center;position:sticky;top:20px}
.avatar-wrap{position:relative;width:132px;height:132px;margin:0 auto 15px}
.profile-avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;border:4px solid rgba(7,134,108,.25);background:rgba(7,134,108,.12);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#07866c}
.avatar-upload{position:absolute;right:2px;bottom:2px;width:42px;height:42px;border-radius:50%;border:0;background:#07866c;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(0,0,0,.2)}
.avatar-upload input{display:none}
.profile-name{margin:5px 0 2px;font-size:1.35rem}
.profile-email{display:block;opacity:.7;font-size:.9rem;word-break:break-word}
.profile-badge{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:999px;background:rgba(7,134,108,.12);color:#07866c;font-weight:700;font-size:.82rem}
.profile-actions{display:grid;gap:10px;margin-top:22px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat-card{padding:18px;text-align:center}
.stat-card strong{display:block;font-size:1.65rem}
.stat-card span{font-size:.82rem;opacity:.7}
.section-card{padding:24px;margin-bottom:20px}
.section-card h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-field{display:flex;flex-direction:column;gap:7px}
.form-field.full{grid-column:1/-1}
.form-field label{font-weight:700;font-size:.9rem}
.form-field input,.form-field select{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #dce3ea;background:transparent;color:inherit;font:inherit}
.results-table{width:100%;border-collapse:collapse}
.results-table th,.results-table td{padding:13px 10px;border-bottom:1px solid rgba(127,127,127,.18);text-align:right}
.results-table th{font-size:.85rem;opacity:.7}
.score-good{font-weight:800}
.empty-results{text-align:center;padding:30px;opacity:.7}
.loading{padding:25px;text-align:center;opacity:.7}
.notice-box{padding:12px 15px;border-radius:12px;margin-bottom:15px;display:none}
.notice-box.ok{display:block;background:rgba(7,134,108,.12)}
.notice-box.err{display:block;background:rgba(185,28,28,.1);color:#b91c1c}
@media(max-width:850px){.account-grid{grid-template-columns:1fr}.profile-card{position:static}.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.results-table{font-size:.82rem}.results-table th,.results-table td{padding:10px 6px}.stats-grid{gap:7px}.stat-card{padding:13px 7px}}
</style>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>حساب الطالب</small></span></a>
    <div id="accountBox"></div>
  </div>
</header>

<main class="account-page">
<div class="container">
  <div class="section-head">
    <span class="eyebrow">Student Account</span>
    <h1>حسابي</h1>
    <p>بياناتك الشخصية ونتائج اختباراتك في مكان واحد.</p>
  </div>

  <div id="pageNotice" class="notice-box"></div>

  <div class="account-grid">
    <aside class="card account-card profile-card">
      <div class="avatar-wrap">
        <div id="avatarBox" class="profile-avatar">ط</div>
        <label class="avatar-upload" title="تغيير الصورة">
          📷
          <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp">
        </label>
      </div>
      <h2 id="profileName" class="profile-name">الطالب</h2>
      <span id="profileEmail" class="profile-email"></span>
      <span id="profileGrade" class="profile-badge">الفرقة —</span>
      <div class="profile-actions">
        <button class="btn ghost" type="button" id="logoutBtn">تسجيل الخروج</button>
        <a class="btn primary" href="quizzes.html">اذهب إلى بنك الاختبارات ←</a>
      </div>
    </aside>

    <section>
      <div class="stats-grid">
        <div class="card stat-card"><strong id="attemptCount">0</strong><span>اختبارات</span></div>
        <div class="card stat-card"><strong id="averageScore">0%</strong><span>متوسط الدرجات</span></div>
        <div class="card stat-card"><strong id="bestScore">0%</strong><span>أفضل نتيجة</span></div>
      </div>

      <div class="card section-card">
        <h2>بيانات الحساب</h2>
        <form id="profileForm" class="form-grid">
          <div class="form-field">
            <label for="fullName">الاسم</label>
            <input id="fullName" maxlength="120" required>
          </div>
          <div class="form-field">
            <label for="phone">رقم الهاتف</label>
            <input id="phone" maxlength="30" placeholder="اختياري">
          </div>
          <div class="form-field">
            <label for="grade">الفرقة الدراسية</label>
            <select id="grade">
              <option value="Year 1">الفرقة الأولى</option>
              <option value="Year 2">الفرقة الثانية</option>
              <option value="Year 3">الفرقة الثالثة</option>
              <option value="Year 4">الفرقة الرابعة</option>
            </select>
          </div>
          <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input id="email" disabled>
          </div>
          <div class="form-field full">
            <button class="btn primary" id="saveProfile" type="submit">حفظ التغييرات</button>
          </div>
        </form>
      </div>

      <div class="card section-card">
        <h2>📊 نتائج الاختبارات</h2>
        <p>كل نتيجة محفوظة على حسابك فقط.</p>
        <div id="resultsBox" class="loading">جاري تحميل النتائج...</div>
      </div>
    </section>
  </div>
</div>
</main>

<script src="account.js"></script>
</body>
</html>
