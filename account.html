<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | ChemistryHub"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>كلية التربية • قسم الكيمياء</small></span></a><a class="btn ghost" href="index.html">الرئيسية</a></div></header>
<main class="section"><div class="container"><div class="card account-page"><span class="eyebrow">My Account</span><h1>حسابي</h1><div id="accountContent" class="account-details">جاري التحميل...</div></div></div></main>
<script>
(async()=>{try{const user=await getCurrentUser();if(!user){location.href="login.html";return}const client=initSupabase();
const {data:profile,error:profileError}=await client.from("profiles").select("full_name,phone,grade,role").eq("id",user.id).single();
if(profileError) throw profileError;
const name=profile.full_name||getDisplayName(user);
document.getElementById("accountContent").innerHTML=`<div class="profile-avatar">${escapeHTML(name.slice(0,1))}</div><h2>${escapeHTML(name)}</h2><p><b>البريد:</b> ${escapeHTML(user.email)}</p><p><b>الهاتف:</b> ${escapeHTML(profile.phone||"غير مضاف")}</p><p><b>الفرقة:</b> ${escapeHTML(profile.grade||"غير محددة")}</p><p><b>الصلاحية:</b> ${profile.role==="admin"?"مدير":"طالب"}</p><p><b>حالة البريد:</b> ${user.email_confirmed_at?"مؤكد":"غير مؤكد"}</p><button class="btn primary" onclick="logout()">تسجيل الخروج</button>`}catch(e){document.getElementById("accountContent").textContent="تعذر تحميل بيانات الحساب."}})();
</script></body></html>
