<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار | ChemistryHub"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><style>.quiz-page{padding:45px 0 80px}.q-card{padding:22px;margin:15px 0}.q-option{display:block;padding:12px;border:1px solid #dce3ea;border-radius:10px;margin:8px 0;cursor:pointer}.q-option:hover{background:rgba(2,132,199,.06)}.result{padding:20px;border-radius:16px;background:rgba(7,134,108,.10);margin-top:20px;font-size:20px;text-align:center}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>اختبارات</small></span></a><div id="accountBox"></div></div></header><main class="quiz-page"><div class="container"><div id="quiz"></div></div></main><script>const c=window.supabaseClient||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);window.supabaseClient=c;const esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[z]));async function boot(){if(!(await protectPage()))return;setupAuthUI();const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('quiz').innerHTML='<div class="card"><h2>لم يتم اختيار اختبار.</h2></div>';return}const {data:q,error}=await c.from('quizzes').select('*,subjects(name)').eq('id',id).eq('active',true).single();if(error){document.getElementById('quiz').innerHTML='<div class="card"><h2>الاختبار غير موجود.</h2></div>';return}const {data:qs}=await c.from('quiz_questions').select('*').eq('quiz_id',id).order('created_at');document.title=q.title+' | ChemistryHub';document.getElementById('quiz').innerHTML=`<div class="section-head"><span class="eyebrow">Quiz</span><h1>${esc(q.title)}</h1><p>${esc(q.description||q.subjects?.name||'اختبار')}</p></div><form id="quizForm">${(qs||[]).map((x,i)=>`<div class="q-card card"><h3>${i+1}. ${esc(x.question)}</h3>${(x.options||[]).map((o,j)=>`<label class="q-option"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn primary" type="submit">تصحيح الاختبار</button></form><div id="result"></div>`;document.getElementById('quizForm').onsubmit=e=>{e.preventDefault();let score=0,answered=0;(qs||[]).forEach((x,i)=>{const a=document.querySelector('input[name="q'+i+'"]:checked');if(a){answered++;if(Number(a.value)===Number(x.correct_index))score++;}});const total=(qs||[]).length;document.getElementById('result').innerHTML='<div class="result">النتيجة: <b>'+score+'</b> / '+total+' — تمت الإجابة عن '+answered+' من '+total+'</div>';};}boot();</script></body></html>
