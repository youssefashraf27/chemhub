<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار | ChemistryHub</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.quiz-page{padding:45px 0 80px}.q-card{padding:22px;margin:15px 0}.q-option{display:block;padding:12px;border:1px solid #dce3ea;border-radius:10px;margin:8px 0;cursor:pointer}.result{padding:20px;border-radius:16px;background:rgba(7,134,108,.1);margin-top:20px;font-size:20px;text-align:center}</style><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-icon">🧪</span><span>ChemistryHub<small>اختبارات</small></span></a><div id="accountBox"></div></div></header><main class="quiz-page"><div class="container"><div id="quiz"></div></div></main><script>const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[z]));let quizData,questionData,currentUser;async function boot(){if(!(await protectPage()))return;currentUser=await setupAuthUI();const {data:u}=await c.auth.getUser();currentUser=u;if(!currentUser)return;const id=new URLSearchParams(location.search).get('id');if(!id){quiz.innerHTML='<div class="card"><h2>لم يتم اختيار اختبار.</h2></div>';return}const q=await c.from('ch_quizzes').select('*,ch_subjects(name)').eq('id',id).eq('active',true).single();if(q.error){quiz.innerHTML='<div class="card"><h2>الاختبار غير موجود.</h2></div>';return}const qs=await c.from('ch_quiz_questions').select('*').eq('quiz_id',id).order('created_at');if(qs.error){quiz.innerHTML='<div class="card"><h2>تعذر تحميل أسئلة الاختبار.</h2></div>';return}quizData=q.data;questionData=qs.data||[];document.title=q.data.title+' | ChemistryHub';quiz.innerHTML=`<div class="section-head"><span class="eyebrow">Quiz</span><h1>${esc(q.data.title)}</h1><p>${esc(q.data.description||q.data.ch_subjects?.name||'اختبار')}</p></div><form id="quizForm">${questionData.map((x,i)=>`<div class="q-card card"><h3>${i+1}. ${esc(x.question)}</h3>${(x.options||[]).map((o,j)=>`<label class="q-option"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn primary" id="submitQuiz">تصحيح الاختبار</button></form><div id="result"></div>`;document.getElementById('quizForm').onsubmit=submitQuiz}async function submitQuiz(e){e.preventDefault();const btn=document.getElementById('submitQuiz');btn.disabled=true;let score=0,answered=0;const answers={};questionData.forEach((x,i)=>{const a=document.querySelector('input[name="q'+i+'"]:checked');answers[x.id]=a?+a.value:null;if(a){answered++;if(+a.value===+x.correct_index)score++}});const total=questionData.length;const r=await c.from('ch_quiz_attempts').insert({quiz_id:quizData.id,user_id:currentUser.id,score,total_questions:total,answered_questions:answered,answers});if(r.error){btn.disabled=false;document.getElementById('result').innerHTML='<div class="result" style="color:#b91c1c">تعذر حفظ النتيجة: '+esc(r.error.message)+'</div>';return}document.getElementById('result').innerHTML=`<div class="result">النتيجة: <b>${score}</b> / ${total} — تمت الإجابة عن ${answered} من ${total}<br><small>تم إرسال النتيجة إلى لوحة الإدارة.</small></div>`;btn.textContent='تم إرسال النتيجة';}boot();</script></body></html>
